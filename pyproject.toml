[project]
name = "vnpy-disruptor-engine"
version = "0.1.0"
description = "High-performance institutional-grade event engine for VeighNa"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "vnpy team"}]
dependencies = [
    "vnpy>=3.9.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "psutil>=7.2.2",
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "vnpy_disruptor_engine.vnpy_disruptor"
python-source = "python"
python-packages = ["vnpy_disruptor_engine"]

[tool.maturin.environment]
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["tests", "examples"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
    "S",    # flake8-serious
    "RUF",  # Ruff-specific rules
]
ignore = [
    "ANN401", # Dynamically typed expressions (Any) are disallowed
    "S101",   # Use of assert detected
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]
"examples/*" = ["ANN", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty]

[tool.ty.src]
exclude = ["tests/", "examples/"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "vnpy_disruptor_engine.vnpy_disruptor",
    "vnpy_disruptor_engine.vnpy_disruptor.*",
]
